<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>အာစရိယပူဇော်ပွဲ</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      text-align: center;
    }

    header {
      background: #6c5ce7;
      color: white;
      padding: 40px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      font-size: 17px;
      margin-top: 10px;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .amount {
      font-size: 35px;
      font-weight: bold;
      color: #6c5ce7;
    }

    .donor {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    footer {
      margin-top: 40px;
      padding: 25px;
      background: #222;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>အာစရိယပူဇော်ပွဲ</h1>
    <p>အလှူငွေစာရင်းနှင့် ပွဲအချက်အလက်များ</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>စုစုပေါင်း အလှူငွေ</h2>
      <div class="amount">1,500,000 MMK</div>
    </div>

    <div class="card">
      <h2>အလှူရှင်များ</h2>

      <div class="donor">
        <span>မောင်မောင်</span>
        <strong>100,000 MMK</strong>
      </div>

      <div class="donor">
        <span>ကိုအောင်</span>
        <strong>200,000 MMK</strong>
      </div>

      <div class="donor">
        <span>မစုစု</span>
        <strong>50,000 MMK</strong>
      </div>

    </div>

  </div>

  <footer>
    အာစရိယပူဇော်ပွဲ © 2026
  </footer>

</body>
</html>
